name: Ecology source qualification
on:
  push:
    branches: [repair/ecology-qualification-2026-10-18]
    paths: ['.github/workflows/ecology-source-qualification.yml', 'Tools/EcologyQualification/reviewed-payload.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reviewed-git-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Stage precisely reviewed repair without moving production refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          repo = 'MasterOfTheSmithy/YourQuest'
          base = '1db9a186332d6dc50a0a408bf10e02aae2233759'
          source = pathlib.Path('Tools/EcologyQualification/reviewed-payload.b64')
          if not source.exists():
              print('Reviewed payload not installed yet; no Git objects or branch refs changed.')
              raise SystemExit(0)
          raw = zlib.decompress(base64.b64decode(source.read_text()))
          assert hashlib.sha256(raw).hexdigest() == '8d9aa85526113a232a4811d840e9ff27cbbbf06f21143db3f7f46a69eac766a6'
          payload = json.loads(raw)
          assert payload['baseCommit'] == base
          assert payload['baseTree'] == 'c62ecaaa0638b767903b822e571204414f1102c8'
          allowed = ('Assets/Assets/Scripts/Generated/', 'Tools/ChatAuditVerification/', 'Docs/Audits/2026-10-17/')
          assert len(payload['expected']) == 13
          assert all(p.startswith(allowed) and '..' not in pathlib.PurePosixPath(p).parts for p in payload['expected'])
          # This temporary runner checkout contains no user work; pin the exact reviewed production parent.
          subprocess.run(['git','fetch','origin',base], check=True)
          subprocess.run(['git','checkout','--detach',base], check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == base
          patch = payload['patch'].encode('utf-8')
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().rstrip('\0').split('\0')
          assert sorted(paths) == sorted(payload['expected'])
          subprocess.run(['git','diff','--cached','--check'], check=True)
          data_by_path = {}
          for path, expected in payload['expected'].items():
              data = pathlib.Path(path).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected['sha256'], path
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == expected['blob'], path
              data_by_path[path] = data
          # Only the already reviewed source bytes are uploaded. No workflow/configuration, token, imported asset, or save enters this tree.
          def post(endpoint, body):
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,
                  data=json.dumps(body).encode(), method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for path in sorted(data_by_path):
              expected = payload['expected'][path]
              blob = post('git/blobs', {'encoding':'base64','content':base64.b64encode(data_by_path[path]).decode()})
              assert blob['sha'] == expected['blob'], path
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree = post('git/trees', {'base_tree':payload['baseTree'],'tree':entries})
          receipt = {'baseCommit':base,'baseTree':payload['baseTree'],'treeSha':tree['sha'],
                     'expected':payload['expected'],'payloadSha256':hashlib.sha256(raw).hexdigest(),
                     'branchRefsMoved':False,'evidence':'Exact reviewed source transport; native Unity qualification not claimed.'}
          pathlib.Path('ecology-publication.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
      - uses: actions/upload-artifact@v7
        with:
          name: ecology-reviewed-publication
          path: ecology-publication.json
          if-no-files-found: ignore
          retention-days: 7
