name: Ecology source qualification
on:
  push:
    branches: [repair/ecology-qualification-2026-10-18]
    paths: ['.github/workflows/ecology-source-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet8
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Export isolated compiler and public runtime
        shell: python
        run: |
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['DOTNET_INSTALL_DIR'])
          sdk = sorted((root / 'sdk').glob('8.*'))[-1]
          runtime = sorted((root / 'shared/Microsoft.NETCore.App').glob('8.*'))[-1]
          framework = sorted((root / 'packs/Microsoft.NETCore.App.Ref').glob('8.*'))[-1]
          host = sorted((root / 'host/fxr').glob('8.*'))[-1]
          files = [root / 'dotnet', sdk / 'Newtonsoft.Json.dll']
          for folder in (runtime, framework / 'ref/net8.0', host, sdk / 'Roslyn/bincore'):
              files.extend(p for p in folder.rglob('*') if p.is_file())
          files.extend(p for p in root.glob('*') if p.is_file() and p.name.lower().endswith(('.txt', '.json')))
          hashes = {}
          with zipfile.ZipFile('managed-compiler.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(set(files)):
                  name = str(path.relative_to(root)); data = path.read_bytes()
                  archive.writestr(name, data); hashes[name] = hashlib.sha256(data).hexdigest()
              archive.writestr('compiler-receipt.json', json.dumps({'sdk':sdk.name,'runtime':runtime.name,'sha256':hashes}, indent=2))
          print('Official .NET runtime/compiler only;',len(hashes),'files; no repository credentials or Unity binaries.')
      - uses: actions/upload-artifact@v7
        with:
          name: ecology-managed-compiler
          path: managed-compiler.zip
          if-no-files-found: error
          retention-days: 1
